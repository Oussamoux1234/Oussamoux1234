<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Oussama Essalmani</title>
  <desc id="desc">AI tooling, backend systems, and full-stack products</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#111a3d" />
      <stop offset="1" stop-color="#271253" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)" />
  <rect width="1200" height="320" rx="24" fill="url(#grid)" />
  <ellipse cx="1000" cy="94" rx="270" ry="210" fill="url(#glow)" filter="url(#softGlow)" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="88" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="72" y="160" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1">Oussama Essalmani</text>
    <rect x="76" y="184" width="530" height="4" rx="2" fill="url(#accent)" />
    <text x="76" y="230" fill="#cbd5e1" font-size="22" font-weight="500">AI tooling · backend systems · full-stack products</text>
    <text x="76" y="270" fill="#94a3b8" font-size="16">Building dependable tools for people, services, and agents.</text>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" />
</svg>
